# Façade Traefik du booking-service (bonus TP3).
# k3d local → routage par PATH, sans host ni TLS (pas de DNS public / cert-manager local).
# Accessible sur http://localhost:8081 (mapping k3d "8081:80@loadbalancer").
# Pour un déploiement sur le lab distant : passer en host-based + cert-manager
# (ex. host: booking.tickrush.lab.vlxx.fr, annotations letsencrypt-prod, bloc tls).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: booking-service
  namespace: tickrush
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /events
            pathType: Prefix
            backend:
              service:
                name: booking-service
                port:
                  number: 8080
          - path: /reservations
            pathType: Prefix
            backend:
              service:
                name: booking-service
                port:
                  number: 8080
