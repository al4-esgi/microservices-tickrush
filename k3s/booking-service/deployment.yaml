apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: tickrush
  labels:
    app: booking-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      initContainers:
        - name: wait-for-booking-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h booking-db -p 5432 -U "$DB_USER" -d "$DB_NAME"; do sleep 2; done
          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: booking-db
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: booking-db
                  key: POSTGRES_USER
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 100m
      containers:
        - name: booking-service
          image: tickrush/booking-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # Base : DNS de Service k8s (plus de localhost) + creds depuis le Secret
            - name: DB_HOST
              value: booking-db
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: booking-db
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: booking-db
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: booking-db
                  key: POSTGRES_PASSWORD
            # Appel inter-services via le DNS de Service (aucune IP en dur)
            - name: PAYMENT_URL
              value: http://payment-service:3000
            - name: KAFKA_URL
              value: kafka:29092
            - name: KAFKA_ENABLED
              value: "true"
            - name: RESERVATION_TTL_SECONDS
              value: "120"
            - name: RESERVATION_EXPIRATION_SCAN_INTERVAL_MS
              value: "1000"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "768Mi"
              cpu: "700m"
