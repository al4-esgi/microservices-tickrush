# Identifiants PostgreSQL du payment-service.
# TP uniquement (valeurs en clair) — en prod : Secret externe / sealed-secrets.
apiVersion: v1
kind: Secret
metadata:
  name: payment-db
  namespace: tickrush
type: Opaque
stringData:
  POSTGRES_USER: payment
  POSTGRES_PASSWORD: payment
  POSTGRES_DB: paymentdb
