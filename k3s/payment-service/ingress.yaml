# Façade Traefik du payment-service (bonus TP3).
# k3d local → routage par PATH, sans host ni TLS (voir la note dans booking-service/ingress.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-service
  namespace: tickrush
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /payments
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 3000
