apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: tickrush
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      initContainers:
        - name: wait-for-payment-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h payment-db -p 5432 -U "$DB_USER" -d "$DB_NAME"; do sleep 2; done
          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: payment-db
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: payment-db
                  key: POSTGRES_USER
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 100m
      containers:
        - name: payment-service
          image: tickrush/payment-service:dev
          imagePullPolicy: IfNotPresent    # image importée dans k3d, pas de registry
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: PAYMENT_FAILURE_RATE   # 0 = toujours accepté (démo prévisible)
              value: "0"
            # Une place à 49,90 EUR passe ; trois places (149,70 EUR) sont refusées.
            - name: PAYMENT_REJECTION_THRESHOLD
              value: "100"
            - name: KAFKA_BROKERS
              value: kafka:29092
            - name: KAFKA_GROUP_ID
              value: payment-service
            - name: KAFKA_MAX_ATTEMPTS
              value: "3"
            - name: KAFKA_RETRY_BACKOFF_MS
              value: "1000"
            - name: OUTBOX_RELAY_ENABLED
              value: "true"
            - name: OUTBOX_RELAY_INTERVAL_MS
              value: "500"
            - name: OUTBOX_RELAY_BATCH_SIZE
              value: "50"
            # Base dédiée (DNS de Service k8s) + creds depuis le Secret payment-db
            - name: DB_HOST
              value: payment-db
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: payment-db
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: payment-db
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-db
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "96Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
