apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: kafka-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-topics
          image: apache/kafka:3.8.0
          command: ["/bin/bash", "/config/create-topics.sh"]
          env:
            - name: KAFKA_BOOTSTRAP_SERVER
              value: kafka:29092
          volumeMounts:
            - name: topic-init
              mountPath: /config
              readOnly: true
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 250m
      volumes:
        - name: topic-init
          configMap:
            name: kafka-topic-init
