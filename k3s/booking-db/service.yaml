# Expose la base à l'intérieur du cluster (les autres pods l'atteignent via `booking-db:5432`).
apiVersion: v1
kind: Service
metadata:
  name: booking-db
  namespace: tickrush
spec:
  selector:
    app: booking-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
