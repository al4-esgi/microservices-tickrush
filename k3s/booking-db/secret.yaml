# Identifiants PostgreSQL du booking-service.
# TP uniquement (valeurs en clair) — en prod : Secret externe / sealed-secrets.
apiVersion: v1
kind: Secret
metadata:
  name: booking-db
  namespace: tickrush
type: Opaque
stringData:
  POSTGRES_USER: booking
  POSTGRES_PASSWORD: booking
  POSTGRES_DB: bookingdb
