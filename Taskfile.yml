# Taskfile TickRush — orchestration du cluster k3d local et des services.
# Prérequis : docker, k3d, kubectl  (task : `brew install go-task`).
# Démarrage : `task up`  ·  liste des commandes : `task`  ou  `task --list`.
version: '3'

vars:
  CLUSTER: tickrush
  NS: tickrush
  KAFKA_BOOTSTRAP: kafka:29092

tasks:
  default:
    desc: "Lister les commandes disponibles"
    cmds:
      - task --list
    silent: true

  # ============ Bring-up complet ============
  up:
    desc: "Tout démarrer : cluster + build + import + déploiement"
    cmds:
      - task: cluster
      - task: build
      - task: import
      - task: deploy
      - task: wait
      - task: urls

  # ============ Cluster ============
  cluster:
    desc: "Créer le cluster k3d (ignoré s'il existe déjà)"
    status:
      - k3d cluster list | grep -qw {{.CLUSTER}}
    cmds:
      - k3d cluster create {{.CLUSTER}} --port "8081:80@loadbalancer" --port "8443:443@loadbalancer" --wait

  start:
    desc: "Rallumer le cluster (après task stop)"
    cmds:
      - k3d cluster start {{.CLUSTER}}

  stop:
    desc: "Éteindre le cluster (données conservées)"
    cmds:
      - task: unforward
      - k3d cluster stop {{.CLUSTER}}

  down:
    desc: "Supprimer le cluster (perte des données)"
    prompt: "Supprimer définitivement le cluster {{.CLUSTER}} et ses données ?"
    cmds:
      - task: unforward
      - k3d cluster delete {{.CLUSTER}}

  # ============ Images ============
  build:
    desc: "Construire les 3 images (booking, payment, notification)"
    cmds:
      - docker build -t tickrush/booking-service:dev ./booking-service
      - docker build -t tickrush/payment-service:dev ./payment-service
      - docker build -t tickrush/notification-service:dev ./notification-service

  import:
    desc: "Importer les images dans le cluster k3d"
    cmds:
      - k3d image import tickrush/booking-service:dev tickrush/payment-service:dev tickrush/notification-service:dev -c {{.CLUSTER}}

  # ============ Qualité ============
  test:
    desc: "Exécuter les tests et builds des services et du frontend"
    cmds:
      - task: test:booking
      - task: test:payment
      - task: test:notification
      - task: test:frontend

  test:booking:
    desc: "Tests Java (H2 en mémoire, dont concurrence) dans le stage Maven"
    cmds:
      - docker build --target build -t tickrush/booking-service:test ./booking-service

  test:payment:
    desc: "Lint, tests Jest et compilation NestJS"
    cmds:
      - docker build --target build -t tickrush/payment-service:test ./payment-service

  test:notification:
    desc: "Tests FastAPI et SMTP simulé"
    cmds:
      - docker build --target test -t tickrush/notification-service:test ./notification-service

  test:frontend:
    desc: "Lint et compilation TypeScript/Vite"
    dir: frontend
    cmds:
      - npm ci
      - npm run lint
      - npm run build

  # ============ Déploiement ============
  deploy:
    desc: "Déployer l'infrastructure, attendre sa disponibilité, puis les services"
    cmds:
      - kubectl apply -f k3s/namespace.yaml
      - kubectl apply -f k3s/booking-db/ -f k3s/payment-db/ -f k3s/maildev/
      - kubectl -n {{.NS}} delete job kafka-init --ignore-not-found
      - kubectl apply -k k3s/kafka/
      - task: wait:infra
      - kubectl apply -f k3s/booking-service/ -f k3s/payment-service/ -f k3s/notification-service/

  wait:infra:
    internal: true
    cmds:
      - for: [booking-db, payment-db, maildev, kafka, kafka-ui]
        cmd: kubectl -n {{.NS}} rollout status deployment/{{.ITEM}} --timeout=240s
      - kubectl -n {{.NS}} wait --for=condition=complete job/kafka-init --timeout=180s

  wait:
    desc: "Attendre que tous les déploiements soient prêts"
    cmds:
      - for: [booking-db, payment-db, maildev, kafka, kafka-ui, booking-service, payment-service, notification-service]
        cmd: kubectl -n {{.NS}} rollout status deployment/{{.ITEM}} --timeout=240s
      - kubectl -n {{.NS}} wait --for=condition=complete job/kafka-init --timeout=180s

  redeploy:
    desc: "Rebuild + réimport + mise à jour de l'infrastructure et des services"
    cmds:
      - task: build
      - task: import
      - kubectl -n {{.NS}} delete job kafka-init --ignore-not-found
      - kubectl apply -k k3s/kafka/
      - kubectl -n {{.NS}} rollout status deployment/kafka --timeout=240s
      - kubectl -n {{.NS}} wait --for=condition=complete job/kafka-init --timeout=180s
      - kubectl apply -f k3s/booking-service/ -f k3s/payment-service/ -f k3s/notification-service/
      - kubectl -n {{.NS}} rollout restart deployment/booking-service deployment/payment-service deployment/notification-service
      - task: wait

  # ============ Accès / port-forwards ============
  urls:
    desc: "Afficher les points d'accès"
    silent: true
    cmds:
      - |
        echo ""
        echo "Ingress Traefik  ->  http://localhost:8081"
        echo "   booking : GET /events/{id} | POST /reservations | GET /reservations/{id}"
        echo "   payment : POST /payments"
        echo "   notif   : consumer Kafka TicketIssued/ReservationExpired + endpoint HTTP de diagnostic"
        echo ""
        echo "MailDev (emails) : task forward  puis  http://localhost:1080"
        echo "Bases (via task forward) : booking-db localhost:5432 | payment-db localhost:5433"
        echo "Kafka UI : task kafka:ui  puis  http://localhost:8090"
        echo "Kafka externe : task kafka:forward  ->  localhost:9092"
        echo ""

  forward:
    desc: "Ouvrir tous les port-forwards en arrière-plan (services, DBs, MailDev)"
    cmds:
      - task: unforward
      - |
        nohup kubectl -n {{.NS}} port-forward svc/booking-service 8080:8080      >/tmp/pf-booking.log       2>&1 &
        nohup kubectl -n {{.NS}} port-forward svc/payment-service 3000:3000      >/tmp/pf-payment.log       2>&1 &
        nohup kubectl -n {{.NS}} port-forward svc/notification-service 8000:8000 >/tmp/pf-notification.log  2>&1 &
        nohup kubectl -n {{.NS}} port-forward svc/maildev 1080:1080              >/tmp/pf-maildev.log       2>&1 &
        nohup kubectl -n {{.NS}} port-forward svc/booking-db 5432:5432           >/tmp/pf-booking-db.log    2>&1 &
        nohup kubectl -n {{.NS}} port-forward svc/payment-db 5433:5432           >/tmp/pf-payment-db.log    2>&1 &
        nohup kubectl -n {{.NS}} port-forward svc/kafka 9092:9092                >/tmp/pf-kafka.log         2>&1 &
        nohup kubectl -n {{.NS}} port-forward svc/kafka-ui 8090:8080             >/tmp/pf-kafka-ui.log      2>&1 &
        sleep 2
      - task: forward:status

  forward:maildev:
    desc: "Port-forward MailDev seul (bloquant, Ctrl-C pour arrêter)"
    cmds:
      - echo "MailDev -> http://localhost:1080  (Ctrl-C pour arrêter)"
      - kubectl -n {{.NS}} port-forward svc/maildev 1080:1080

  forward:status:
    desc: "Lister les port-forwards actifs"
    silent: true
    cmds:
      - pgrep -fl 'kubectl -n {{.NS}} port-forward' || echo "aucun port-forward actif"

  unforward:
    desc: "Fermer tous les port-forwards"
    cmds:
      - pkill -f 'kubectl -n {{.NS}} port-forward' || true

  # ============ Observation ============
  status:
    desc: "État du cluster (pods, services, ingress)"
    cmds:
      - kubectl -n {{.NS}} get pods,deployments,jobs,svc,pvc,ingress

  logs:
    desc: "Logs d'un service — usage : task logs -- booking-service"
    cmds:
      - kubectl -n {{.NS}} logs -f deployment/{{.CLI_ARGS}}

  demo:reset:
    desc: "Réinitialiser réservations, paiements et stocks de la démo locale"
    prompt: "Effacer toutes les réservations et tous les paiements du cluster local ?"
    cmds:
      - kubectl -n {{.NS}} exec deployment/booking-db -- psql -v ON_ERROR_STOP=1 -U booking -d bookingdb -c "TRUNCATE TABLE processed_events, outbox, reservations RESTART IDENTITY; UPDATE events SET available_seats = total_seats, version = version + 1;"
      - kubectl -n {{.NS}} exec deployment/payment-db -- psql -v ON_ERROR_STOP=1 -U payment -d paymentdb -c "TRUNCATE TABLE outbox, payments RESTART IDENTITY;"
      - echo "Données de démonstration réinitialisées"

  # ============ Front de démo ============
  front:
    desc: "Lancer la console de démo (Vite) sur http://localhost:5173"
    dir: frontend
    cmds:
      - '[ -d node_modules ] || npm install'
      - task: forward:maildev-bg
      - npm run dev

  # port-forward MailDev en tâche de fond (nécessaire à l'onglet Emails du front)
  forward:maildev-bg:
    internal: true
    status:
      - pgrep -f 'kubectl -n {{.NS}} port-forward svc/maildev' >/dev/null
    cmds:
      - nohup kubectl -n {{.NS}} port-forward svc/maildev 1080:1080 >/tmp/pf-maildev.log 2>&1 &

  # ============ Kafka / TP4 ============
  kafka:topics:
    desc: "Lister et décrire les onze topics métier et dead-letter TickRush"
    cmds:
      - kubectl -n {{.NS}} exec deployment/kafka -- /opt/kafka/bin/kafka-topics.sh --bootstrap-server {{.KAFKA_BOOTSTRAP}} --list
      - |
        for topic in booking.seat-reserved booking.reservation-expired booking.seat-released booking.ticket-issued payment.received payment.rejected booking.seat-reserved.DLQ payment.received.DLT payment.rejected.DLT booking.ticket-issued.DLT booking.reservation-expired.DLT; do
          kubectl -n {{.NS}} exec deployment/kafka -- /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server {{.KAFKA_BOOTSTRAP}} --describe --topic "$topic"
        done

  kafka:produce-demo:
    desc: "Produire 10 sondes de partition avec 3 clés reservationId"
    cmds:
      - |
        kubectl -n {{.NS}} exec -i deployment/kafka -- /opt/kafka/bin/kafka-console-producer.sh \
          --bootstrap-server {{.KAFKA_BOOTSTRAP}} --topic booking.seat-reserved \
          --property parse.key=true --property key.separator=: < scripts/kafka-demo-events.txt

  kafka:consume-demo:
    desc: "Relire les événements avec clé, partition et offset"
    cmds:
      - |
        kubectl -n {{.NS}} exec deployment/kafka -- /opt/kafka/bin/kafka-console-consumer.sh \
          --bootstrap-server {{.KAFKA_BOOTSTRAP}} --topic booking.seat-reserved \
          --from-beginning --max-messages 10 \
          --property print.key=true --property print.partition=true --property print.offset=true \
          --property key.separator=' | '

  kafka:consume:partition:
    desc: "Relire uniquement la partition 0 de booking.seat-reserved"
    cmds:
      - |
        kubectl -n {{.NS}} exec deployment/kafka -- /opt/kafka/bin/kafka-console-consumer.sh \
          --bootstrap-server {{.KAFKA_BOOTSTRAP}} --topic booking.seat-reserved \
          --partition 0 --offset earliest --max-messages 7 \
          --property print.key=true --property print.offset=true --property key.separator=' | '

  kafka:group:consume:
    desc: "Démarrer un consommateur du groupe tickrush-demo (Ctrl-C pour arrêter)"
    cmds:
      - kubectl -n {{.NS}} exec -it deployment/kafka -- /opt/kafka/bin/kafka-console-consumer.sh --bootstrap-server {{.KAFKA_BOOTSTRAP}} --topic booking.seat-reserved --group tickrush-demo

  kafka:group:describe:
    desc: "Afficher offsets et lag du groupe tickrush-demo"
    cmds:
      - kubectl -n {{.NS}} exec deployment/kafka -- /opt/kafka/bin/kafka-consumer-groups.sh --bootstrap-server {{.KAFKA_BOOTSTRAP}} --describe --group tickrush-demo

  kafka:lag-demo:
    desc: "Créer un groupe qui ne lit que 3 messages puis afficher son lag"
    cmds:
      - |
        if kubectl -n {{.NS}} exec deployment/kafka -- /opt/kafka/bin/kafka-consumer-groups.sh \
          --bootstrap-server {{.KAFKA_BOOTSTRAP}} --list | grep -qx tickrush-lag-demo; then
          kubectl -n {{.NS}} exec deployment/kafka -- /opt/kafka/bin/kafka-consumer-groups.sh \
            --bootstrap-server {{.KAFKA_BOOTSTRAP}} --delete --group tickrush-lag-demo
        fi
      - |
        kubectl -n {{.NS}} exec deployment/kafka -- /opt/kafka/bin/kafka-console-consumer.sh \
          --bootstrap-server {{.KAFKA_BOOTSTRAP}} --topic booking.seat-reserved \
          --group tickrush-lag-demo --from-beginning --max-messages 3 >/dev/null
      - kubectl -n {{.NS}} exec deployment/kafka -- /opt/kafka/bin/kafka-consumer-groups.sh --bootstrap-server {{.KAFKA_BOOTSTRAP}} --describe --group tickrush-lag-demo

  kafka:forward:
    desc: "Exposer le listener Kafka EXTERNAL sur localhost:9092 (Ctrl-C pour arrêter)"
    cmds:
      - kubectl -n {{.NS}} port-forward svc/kafka 9092:9092

  kafka:ui:
    desc: "Ouvrir Kafka UI sur http://localhost:8090 (Ctrl-C pour arrêter)"
    cmds:
      - echo "Kafka UI -> http://localhost:8090  (Ctrl-C pour arrêter)"
      - kubectl -n {{.NS}} port-forward svc/kafka-ui 8090:8080

  # ============ Pipeline événementiel / TP5 ============
  tp5:demo:
    desc: "Prouver POST -> SeatReserved -> PaymentReceived puis le rejeu idempotent"
    cmds:
      - bash scripts/tp05-demo.sh

  tp5:poison:
    desc: "Prouver les 3 tentatives puis DLQ côté Node et DLT côté Java"
    cmds:
      - bash scripts/tp05-poison-demo.sh

  tp5:rejection:
    desc: "Prouver le refus déterministe d'un paiement supérieur à 100 EUR"
    cmds:
      - bash scripts/tp05-rejection-demo.sh

  # ============ Saga chorégraphiée / TP6 ============
  tp6:demo:
    desc: "Démontrer TicketIssued, PaymentFailed, compensation et rejeu idempotent"
    cmds:
      - bash scripts/tp06-saga-demo.sh

  tp6:ttl:
    desc: "Démontrer l'expiration TTL et la remise en stock (configuration restaurée ensuite)"
    cmds:
      - bash scripts/tp06-ttl-demo.sh

  tp6:chaos:
    desc: "Démontrer la reprise de saga après indisponibilité de payment-service"
    cmds:
      - bash scripts/tp06-chaos-demo.sh

  # ============ Transactional Outbox / TP7 ============
  tp7:outbox:
    desc: "Couper Kafka, créer une réservation puis prouver le rattrapage Outbox"
    cmds:
      - bash scripts/tp07-outbox-crash-demo.sh

  # ============ Test rapide ============
  smoke:
    desc: "Scénario nominal TP7 : la saga traverse les deux Outbox jusqu'au billet"
    silent: true
    cmds:
      - |
        set -e
        E=11111111-1111-1111-1111-111111111111
        echo "-> événement :"; curl -s localhost:8081/events/$E; echo
        R=$(curl --fail-with-body -s -X POST localhost:8081/reservations -H 'Content-Type: application/json' \
              -d "{\"eventId\":\"$E\",\"customerRef\":\"smoke@esgi.fr\",\"quantity\":1}")
        echo "-> réservation : $R"
        RID=$(echo "$R" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
        test -n "$RID"
        for i in $(seq 1 20); do
          CURRENT=$(curl --fail-with-body -s localhost:8081/reservations/$RID)
          echo "$CURRENT" | grep -q '"status":"TICKET_ISSUED"' && break
          sleep 1
        done
        echo "$CURRENT" | grep -q '"status":"TICKET_ISSUED"'
        echo "$CURRENT" | grep -Eq '"ticketId":"[0-9a-f-]{36}"'
        echo "-> pipeline Kafka terminé : $CURRENT"
        PAYMENT=$(curl --fail-with-body -s localhost:8081/reservations/$RID/payment-status)
        echo "$PAYMENT" | grep -q 'RECEIVED'
        echo "-> paiement persistant : $PAYMENT"
