# Taskfile TickRush — orchestration du cluster k3d local et des services.
# Prérequis : docker, k3d, kubectl  (task : `brew install go-task`).
# Démarrage : `task up`  ·  liste des commandes : `task`  ou  `task --list`.
version: '3'

vars:
  CLUSTER: tickrush
  NS: tickrush

tasks:
  default:
    desc: "Lister les commandes disponibles"
    cmds:
      - task --list
    silent: true

  # ============ Bring-up complet ============
  up:
    desc: "Tout démarrer : cluster + build + import + déploiement"
    cmds:
      - task: cluster
      - task: build
      - task: import
      - task: deploy
      - task: wait
      - task: urls

  # ============ Cluster ============
  cluster:
    desc: "Créer le cluster k3d (ignoré s'il existe déjà)"
    status:
      - k3d cluster list | grep -qw {{.CLUSTER}}
    cmds:
      - k3d cluster create {{.CLUSTER}} --port "8081:80@loadbalancer" --port "8443:443@loadbalancer" --wait

  start:
    desc: "Rallumer le cluster (après task stop)"
    cmds:
      - k3d cluster start {{.CLUSTER}}

  stop:
    desc: "Éteindre le cluster (données conservées)"
    cmds:
      - task: unforward
      - k3d cluster stop {{.CLUSTER}}

  down:
    desc: "Supprimer le cluster (perte des données)"
    prompt: "Supprimer définitivement le cluster {{.CLUSTER}} et ses données ?"
    cmds:
      - task: unforward
      - k3d cluster delete {{.CLUSTER}}

  # ============ Images ============
  build:
    desc: "Construire les 3 images (booking, payment, notification)"
    cmds:
      - docker build -t tickrush/booking-service:dev ./booking-service
      - docker build -t tickrush/payment-service:dev ./payment-service
      - docker build -t tickrush/notification-service:dev ./notification-service

  import:
    desc: "Importer les images dans le cluster k3d"
    cmds:
      - k3d image import tickrush/booking-service:dev tickrush/payment-service:dev tickrush/notification-service:dev -c {{.CLUSTER}}

  # ============ Déploiement ============
  deploy:
    desc: "Appliquer tous les manifests k8s"
    cmds:
      - kubectl apply -f k3s/namespace.yaml
      - kubectl apply -f k3s/booking-db/ -f k3s/payment-db/ -f k3s/maildev/
      - kubectl apply -f k3s/booking-service/ -f k3s/payment-service/ -f k3s/notification-service/

  wait:
    desc: "Attendre que tous les déploiements soient prêts"
    cmds:
      - for: [booking-db, payment-db, maildev, booking-service, payment-service, notification-service]
        cmd: kubectl -n {{.NS}} rollout status deployment/{{.ITEM}} --timeout=180s

  redeploy:
    desc: "Rebuild + réimport + redémarrage des services (après modif de code)"
    cmds:
      - task: build
      - task: import
      - kubectl -n {{.NS}} rollout restart deployment/booking-service deployment/payment-service deployment/notification-service
      - task: wait

  # ============ Accès / port-forwards ============
  urls:
    desc: "Afficher les points d'accès"
    silent: true
    cmds:
      - |
        echo ""
        echo "Ingress Traefik  ->  http://localhost:8081"
        echo "   booking : GET /events/{id} | POST /reservations | GET /reservations/{id}"
        echo "   payment : POST /payments"
        echo "   notif   : POST /notifications/ticket-issued"
        echo ""
        echo "MailDev (emails) : task forward  puis  http://localhost:1080"
        echo "Bases (via task forward) : booking-db localhost:5432 | payment-db localhost:5433"
        echo ""

  forward:
    desc: "Ouvrir tous les port-forwards en arrière-plan (services, DBs, MailDev)"
    cmds:
      - task: unforward
      - |
        nohup kubectl -n {{.NS}} port-forward svc/booking-service 8080:8080      >/tmp/pf-booking.log       2>&1 &
        nohup kubectl -n {{.NS}} port-forward svc/payment-service 3000:3000      >/tmp/pf-payment.log       2>&1 &
        nohup kubectl -n {{.NS}} port-forward svc/notification-service 8000:8000 >/tmp/pf-notification.log  2>&1 &
        nohup kubectl -n {{.NS}} port-forward svc/maildev 1080:1080              >/tmp/pf-maildev.log       2>&1 &
        nohup kubectl -n {{.NS}} port-forward svc/booking-db 5432:5432           >/tmp/pf-booking-db.log    2>&1 &
        nohup kubectl -n {{.NS}} port-forward svc/payment-db 5433:5432           >/tmp/pf-payment-db.log    2>&1 &
        sleep 2
      - task: forward:status

  forward:maildev:
    desc: "Port-forward MailDev seul (bloquant, Ctrl-C pour arrêter)"
    cmds:
      - echo "MailDev -> http://localhost:1080  (Ctrl-C pour arrêter)"
      - kubectl -n {{.NS}} port-forward svc/maildev 1080:1080

  forward:status:
    desc: "Lister les port-forwards actifs"
    silent: true
    cmds:
      - pgrep -fl 'kubectl -n {{.NS}} port-forward' || echo "aucun port-forward actif"

  unforward:
    desc: "Fermer tous les port-forwards"
    cmds:
      - pkill -f 'kubectl -n {{.NS}} port-forward' || true

  # ============ Observation ============
  status:
    desc: "État du cluster (pods, services, ingress)"
    cmds:
      - kubectl -n {{.NS}} get pods,svc,ingress

  logs:
    desc: "Logs d'un service — usage : task logs -- booking-service"
    cmds:
      - kubectl -n {{.NS}} logs -f deployment/{{.CLI_ARGS}}

  # ============ Front de démo ============
  front:
    desc: "Lancer la console de démo (Vite) sur http://localhost:5173"
    dir: frontend
    cmds:
      - '[ -d node_modules ] || npm install'
      - task: forward:maildev-bg
      - npm run dev

  # port-forward MailDev en tâche de fond (nécessaire à l'onglet Emails du front)
  forward:maildev-bg:
    internal: true
    status:
      - pgrep -f 'kubectl -n {{.NS}} port-forward svc/maildev' >/dev/null
    cmds:
      - nohup kubectl -n {{.NS}} port-forward svc/maildev 1080:1080 >/tmp/pf-maildev.log 2>&1 &

  # ============ Test rapide ============
  smoke:
    desc: "Test bout-en-bout via l'Ingress (réserver -> payer -> notifier)"
    silent: true
    cmds:
      - |
        set -e
        E=11111111-1111-1111-1111-111111111111
        echo "-> événement :"; curl -s localhost:8081/events/$E; echo
        R=$(curl -s -X POST localhost:8081/reservations -H 'Content-Type: application/json' \
              -d "{\"eventId\":\"$E\",\"customerRef\":\"smoke\",\"quantity\":1}")
        echo "-> réservation : $R"
        RID=$(echo "$R" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
        curl -s -X POST localhost:8081/payments -H 'Content-Type: application/json' \
              -d "{\"reservationId\":\"$RID\",\"amount\":42}" >/dev/null && echo "-> paiement OK"
        curl -s -X POST localhost:8081/notifications/ticket-issued -H 'Content-Type: application/json' \
              -d "{\"to\":\"smoke@test.fr\",\"reservationId\":\"$RID\",\"eventName\":\"Smoke\",\"quantity\":1}" \
              >/dev/null && echo "-> notification envoyée (voir MailDev)"
