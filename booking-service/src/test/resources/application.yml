spring:
  datasource:
    url: jdbc:h2:mem:tickrush;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: warn

payment:
  base-url: http://localhost:3000

reservation:
  ttl-seconds: 120

tickrush:
  kafka:
    enabled: false
