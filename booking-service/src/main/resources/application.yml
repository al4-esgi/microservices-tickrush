spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bookingdb}
    username: ${DB_USER:booking}
    password: ${DB_PASSWORD:booking}
  jpa:
    hibernate:
      ddl-auto: update   # acceptable pour le TP ; en prod : migrations (Flyway)
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_URL:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        allow.auto.create.topics: false
        enable.idempotence: true
    consumer:
      group-id: booking-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        allow.auto.create.topics: false
    listener:
      ack-mode: record

tickrush:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    topics:
      seat-reserved: booking.seat-reserved
      payment-received: payment.received
      payment-failed: payment.rejected
      ticket-issued: booking.ticket-issued
      reservation-expired: booking.reservation-expired
      seat-released: booking.seat-released

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents

# TTL d'une réservation non payée (user story 2 : remise en vente après 2 min)
reservation:
  ttl-seconds: ${RESERVATION_TTL_SECONDS:120}
  expiration:
    enabled: ${RESERVATION_EXPIRATION_ENABLED:true}
    scan-interval-ms: ${RESERVATION_EXPIRATION_SCAN_INTERVAL_MS:1000}

# URL de payment-service : DNS de Service k8s en cluster, localhost en dev local
payment:
  base-url: ${PAYMENT_URL:http://localhost:3000}

resilience4j:
  circuitbreaker:
    instances:
      payment:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        # false : un circuit OUVERT ne doit PAS faire échouer la liveness probe k8s
        # (l'état reste visible via l'endpoint actuator /actuator/circuitbreakers)
        register-health-indicator: false
